name: Defender check

# Scans the files of a published release with Microsoft Defender on a fresh
# GitHub-hosted VM, after updating its security intelligence, and reports any
# detection (issue #18). It only reads: the scan runs with -DisableRemediation
# so nothing is quarantined, and nothing is published or changed in the repo.
#
# A clean result here is a good sign, not proof: detections such as
# Trojan:Win32/LummaStealer.DO!MTB come from machine-learning and cloud
# protection, whose settings on a server runner can differ from a home PC.
#
# It runs every day on the latest release, so its status badge shows when a
# false-positive submission to Microsoft has taken effect:
# https://github.com/Harshul1484/out-of-windows/actions/workflows/defender-check.yml
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to scan, e.g. v0.1.0 (empty: the latest release)"
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-2025
    steps:
      - name: update Defender and record its versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Closer to a home PC on this disposable VM: cloud-delivered protection
          # on (cloud lookups by file metadata), samples never sent.
          try {
            Set-MpPreference -MAPSReporting Advanced -SubmitSamplesConsent NeverSend
          } catch { Write-Host "::warning::could not turn on cloud protection: $_" }
          # The runner's default update source can report "no updates needed"
          # for days-old intelligence, so fetch straight from Microsoft's
          # malware protection center first. Cached cloud verdicts (dynamic
          # signatures) are dropped before, as Microsoft asks after fixing a
          # false positive.
          $mpcmd = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          & $mpcmd -RemoveDefinitions -DynamicSignatures | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::MpCmdRun -RemoveDefinitions -DynamicSignatures exited $LASTEXITCODE" }
          & $mpcmd -SignatureUpdate -MMPC | Out-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::MpCmdRun -SignatureUpdate -MMPC exited $LASTEXITCODE; trying Microsoft Update"
            # It can report "completed with errors" after installing current
            # intelligence, so its error is a warning; the age test below
            # decides whether the intelligence is current.
            try { Update-MpSignature -UpdateSource MicrosoftUpdateServer -ErrorAction Stop }
            catch { Write-Host "::warning::Update-MpSignature: $($_.Exception.Message)" }
          }
          # Neither update source's exit code fails the step.
          $global:LASTEXITCODE = 0
          $s = Get-MpComputerStatus
          if ($s.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-1)) {
            $msg = "security intelligence is from $($s.AntivirusSignatureLastUpdated), more than a day old: a clean result may not reflect current detections"
            Write-Host "::warning::$msg"
            "> **Warning:** $msg`n" >> $env:GITHUB_STEP_SUMMARY
          }
          $p = Get-MpPreference
          $info = [ordered]@{
            'Engine'                  = $s.AMEngineVersion
            'Antimalware client'      = $s.AMProductVersion
            'Security intelligence'   = $s.AntivirusSignatureVersion
            'Intelligence updated'    = $s.AntivirusSignatureLastUpdated
            'Real-time protection'    = $s.RealTimeProtectionEnabled
            'Cloud protection (MAPS)' = $p.MAPSReporting
          }
          $info.GetEnumerator() | ForEach-Object { Write-Host ("{0,-24} {1}" -f $_.Key, $_.Value) }
          "## Microsoft Defender on the runner`n" >> $env:GITHUB_STEP_SUMMARY
          "| | |`n|---|---|" >> $env:GITHUB_STEP_SUMMARY
          $info.GetEnumerator() | ForEach-Object { "| $($_.Key) | $($_.Value) |" >> $env:GITHUB_STEP_SUMMARY }

      - name: download the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          # A scheduled run has no input: scan the latest release.
          $tag = $env:TAG
          if (-not $tag) { $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$tag' is not a release tag like v1.2.3" }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          # Real-time protection may quarantine a file as it arrives; the
          # scan step reports a file that disappeared as detected.
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir rel --skip-existing
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name' | Set-Content assets.txt

      - name: scan every release file
        shell: pwsh
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          $mpcmd = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          function Invoke-Scan($path, $label) {
            $out = & $mpcmd -Scan -ScanType 3 -File $path -DisableRemediation 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host "== $(Split-Path -Leaf $path), $label (exit $code)`n$out"
            switch ($code) { 0 { 'clean' } 2 { '**detected**' } default { "scan failed (exit $code)" } }
          }
          $names = @(Get-Content assets.txt)
          $dir = Resolve-Path rel
          # Definitions alone first, with cloud lookups off: after Microsoft
          # fixes a false positive, this shows whether the fix has reached the
          # security intelligence while the cloud verdict still lags. It runs
          # before any cloud lookup, so no cloud verdict is cached yet.
          $local = @{}
          try {
            Set-MpPreference -MAPSReporting Disabled
            foreach ($name in $names) {
              $path = Join-Path $dir $name
              if (Test-Path -LiteralPath $path) { $local[$name] = Invoke-Scan $path 'definitions only' }
            }
          } finally { Set-MpPreference -MAPSReporting Advanced }
          # With cloud protection, as on a home PC: this result decides the run.
          $rows = @()
          $flagged = 0
          foreach ($name in $names) {
            $path = Join-Path $dir $name
            if (-not (Test-Path -LiteralPath $path)) {
              $rows += "| $name | removed on download (detected by real-time protection) | |"
              $flagged++
              continue
            }
            $result = Invoke-Scan $path 'with cloud protection'
            if ($result -ne 'clean') { $flagged++ }
            $rows += "| $name | $result | $($local[$name]) |"
          }
          $threats = Get-MpThreatDetection -ErrorAction SilentlyContinue | ForEach-Object {
            $t = Get-MpThreat -ThreatID $_.ThreatID -ErrorAction SilentlyContinue
            "| $($t.ThreatName) | $($_.Resources -join ', ') |"
          }
          "`n## Scan of $env:TAG`n" >> $env:GITHUB_STEP_SUMMARY
          "| File | With cloud protection | Definitions only |`n|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          $rows >> $env:GITHUB_STEP_SUMMARY
          if ($threats) {
            "`n| Detection | Resources |`n|---|---|" >> $env:GITHUB_STEP_SUMMARY
            $threats >> $env:GITHUB_STEP_SUMMARY
          }
          if ($flagged -gt 0) { throw "$flagged file(s) of $env:TAG were detected or could not be scanned; see the summary" }
          Write-Host "Every file of $env:TAG scanned clean."
