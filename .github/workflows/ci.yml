name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # Runners are disposable VMs, so tests may read the real system.
      OOW_TEST_REAL_SYSTEM: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: parse PowerShell scripts (PowerShell 7)
        shell: pwsh
        run: &parse-ps |
          $bad = 0
          foreach ($f in Get-ChildItem -Path scripts, packaging -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad++
            }
          }
          if ($bad -gt 0) { throw "$bad PowerShell syntax error(s)" }
          Write-Host 'PowerShell scripts parse cleanly.'
      - name: parse PowerShell scripts (Windows PowerShell 5.1)
        shell: powershell
        run: *parse-ps
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: fuzz safety invariants
        run: |
          go test ./internal/safety -run '^$' -fuzz FuzzGuardScope -fuzztime 60s
          go test ./internal/safety -run '^$' -fuzz FuzzNormalizeIdempotent -fuzztime 30s
      - name: build
        run: go build -trimpath -o bin/oow.exe ./cmd/oow
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-2025'
        with:
          name: oow-windows-amd64
          path: bin/oow.exe

  e2e-real:
    name: end-to-end on a real Windows Server 2025 VM
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: go build -trimpath -o bin/oow.exe ./cmd/oow
      - name: real cleanup with canaries
        shell: pwsh
        run: ./scripts/ci/e2e-real.ps1 -Oow ./bin/oow.exe
