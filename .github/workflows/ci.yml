name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # Runners are disposable VMs, so tests may read the real system.
      OOW_TEST_REAL_SYSTEM: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: parse PowerShell scripts (PowerShell 7)
        shell: pwsh
        run: &parse-ps |
          $bad = 0
          foreach ($f in Get-ChildItem -Path scripts, packaging -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad++
            }
          }
          if ($bad -gt 0) { throw "$bad PowerShell syntax error(s)" }
          Write-Host 'PowerShell scripts parse cleanly.'
      - name: parse PowerShell scripts (Windows PowerShell 5.1)
        shell: powershell
        run: *parse-ps
      - name: go vet
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C tools vet ./...
      - name: Windows resources match winres/
        shell: pwsh
        run: |
          # The committed .syso files must be exactly what go generate makes
          # from cmd/oow/winres (go-winres output is deterministic).
          go generate ./cmd/oow
          if ($LASTEXITCODE -ne 0) { throw 'go generate ./cmd/oow failed' }
          $changed = git status --porcelain -- cmd/oow
          if ($changed) {
            git status --short -- cmd/oow
            throw 'cmd/oow/rsrc_windows_*.syso are stale: run `go generate ./cmd/oow` and commit the result'
          }
      - name: go test
        run: go test -count=1 ./...
      - name: fuzz safety invariants
        run: |
          go test ./internal/safety -run '^$' -fuzz FuzzGuardScope -fuzztime 60s
          go test ./internal/safety -run '^$' -fuzz FuzzPurgeScope -fuzztime 60s
          go test ./internal/safety -run '^$' -fuzz FuzzNormalizeIdempotent -fuzztime 30s
          go test ./internal/startup -run '^$' -fuzz FuzzParseLink -fuzztime 30s
      - name: build
        run: go build -trimpath -o bin/oow.exe ./cmd/oow
      - name: version information and manifest
        shell: pwsh
        run: |
          # The resource version must be the version the binary reports.
          $v = (./bin/oow.exe version --json | ConvertFrom-Json).version
          ./scripts/ci/check-exe-metadata.ps1 -Exe bin/oow.exe -Version $v
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-2025'
        with:
          name: oow-windows-amd64
          path: bin/oow.exe

  packages:
    name: package manifests (winget, Scoop, Chocolatey)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: render and validate for a stand-in release
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
        run: |
          # The same render and validation the release runs, with fake zips:
          # only their names and SHA-256 end up in the packages. A pre-release
          # version is included to cover version handling in choco pack.
          foreach ($v in '1.2.3', '1.2.3-rc.1') {
            $dist = Join-Path $env:RUNNER_TEMP "dist-$v"
            New-Item -ItemType Directory -Force $dist | Out-Null
            foreach ($arch in 'amd64', 'arm64') {
              [IO.File]::WriteAllText((Join-Path $dist "oow-$v-windows-$arch.zip"), "stand-in for the $arch zip of $v")
            }
            $out = Join-Path $env:RUNNER_TEMP "packages-$v"
            ./packaging/render.ps1 -Version $v -Dist $dist -Out $out -Repo $env:REPO
            ./packaging/validate.ps1 -Version $v -Dist $dist -Dir $out -Repo $env:REPO
          }

  e2e-real:
    name: end-to-end on a real Windows Server 2025 VM
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: go build -trimpath -o bin/oow.exe ./cmd/oow
      - name: real cleanup with canaries
        shell: pwsh
        run: ./scripts/ci/e2e-real.ps1 -Oow ./bin/oow.exe
