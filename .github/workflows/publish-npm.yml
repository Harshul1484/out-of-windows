name: Publish npm

# Publishes the npm package out-of-windows for a published release (#24).
# Manual only: run it once the Defender check passes for that release. The
# package holds the release's own oow.exe files, checked against SHA256SUMS
# and their build-provenance attestations; the exact tarball is installed and
# run on this VM before it is published with npm provenance.
#
# Authentication: the first publish needs the repository secret NPM_TOKEN (an
# npm access token that can publish). After it, configure npm trusted
# publishing for this workflow on npmjs.com and delete the secret: without a
# token, npm authenticates through GitHub's OIDC token instead.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-2025
    permissions:
      contents: read
      attestations: read
      id-token: write     # npm provenance, and trusted publishing without a token
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: download and verify the release executables, then pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Like Chocolatey and winget, npm gets stable versions only.
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "'$env:TAG' is not a stable release tag like v1.2.3" }
          $version = $Matches[1]
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "oow-$version-windows-*.exe" --pattern SHA256SUMS --dir rel
          if ($LASTEXITCODE -ne 0) { throw "could not download the executables of $env:TAG" }
          foreach ($arch in 'amd64', 'arm64') {
            $name = "oow-$version-windows-$arch.exe"
            $line = Get-Content rel/SHA256SUMS | Where-Object { $_ -match "\s\*?$([regex]::Escape($name))$" }
            if (-not $line) { throw "SHA256SUMS has no entry for $name" }
            $want = ($line -split '\s+')[0].ToLowerInvariant()
            $got = (Get-FileHash -LiteralPath "rel/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -ne $want) { throw "$name has SHA-256 $got, SHA256SUMS says $want" }
            gh attestation verify "rel/$name" --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "the attestation of $name did not verify" }
          }
          ./packaging/npm/render.ps1 -Version $version -Amd64Exe "rel/oow-$version-windows-amd64.exe" -Arm64Exe "rel/oow-$version-windows-arm64.exe" -Out npm-pkg
          Push-Location npm-pkg
          $tgz = (npm pack --json | ConvertFrom-Json)[0].filename
          if ($LASTEXITCODE -ne 0 -or -not $tgz) { throw 'npm pack failed' }
          Pop-Location
          "VERSION=$version" >> $env:GITHUB_ENV
          "TARBALL=$(Join-Path (Resolve-Path npm-pkg) $tgz)" >> $env:GITHUB_ENV
          Write-Host "Verified both executables of ${env:TAG}: checksums and attestations. Packed $tgz."

      - name: install that tarball and run oow through the launcher
        shell: pwsh
        run: ./scripts/ci/npm-check.ps1 -Tarball $env:TARBALL -Version $env:VERSION

      - name: publish to npm with provenance
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Trusted publishing (no token) needs npm 11.5.1 or later.
          if ([version](npm --version) -lt [version]'11.5.1') {
            npm install -g 'npm@^11.5.1' | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'could not update npm' }
          }
          if ($env:NODE_AUTH_TOKEN) {
            # npm reads the token from the environment; it is never written out.
            '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' | Set-Content -Encoding ascii -LiteralPath (Join-Path $env:USERPROFILE '.npmrc')
          }
          npm publish $env:TARBALL --provenance --access public
          if ($LASTEXITCODE -ne 0) {
            throw "npm publish exited ${LASTEXITCODE}: with no NPM_TOKEN secret, npm trusted publishing must be configured for this workflow on npmjs.com"
          }
          "Published [out-of-windows $env:VERSION](https://www.npmjs.com/package/out-of-windows/v/$env:VERSION) with provenance." >> $env:GITHUB_STEP_SUMMARY
